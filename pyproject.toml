[project]
name = "sherpa"
version = "0.1.0"
description = "Self-hosted PDF semantic search (retrieval-only, fully private)"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Config / models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Postgres
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Queue
    "celery[redis]>=5.4",
    # Clients
    "qdrant-client>=1.10",
    "boto3>=1.34",
    "httpx>=0.27",
    # Ingestion
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.3",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
