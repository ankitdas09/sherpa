# Sherpa — full self-hosted stack. Everything runs here; nothing leaves.
#
#   docker compose up --build
#
# Services: api, worker, beat, tei, qdrant, postgres, redis, minio (+ minio-init).

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://sherpa:sherpa@postgres:5432/sherpa
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  COLLECTION_NAME: chunks
  EMBED_DIM: "384"
  TEI_URL: http://tei:80
  EMBED_BATCH_SIZE: "32"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: uploads

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sherpa
      POSTGRES_PASSWORD: sherpa
      POSTGRES_DB: sherpa
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherpa"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console

  # One-shot: create the uploads bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/uploads &&
      echo 'bucket uploads ready'
      "

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    # TEI ships amd64 only; emulate on Apple Silicon (slower embeds, fine for dev).
    platform: linux/amd64
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    volumes:
      - hf-cache:/data
    environment:
      HF_HOME: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30   # first boot downloads the model
    ports:
      - "8080:80"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      tei:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      <<: *app-env
      # Workers don't bootstrap; the api owns migrations + qdrant setup.
      RUN_MIGRATIONS_ON_STARTUP: "0"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    # Scale horizontally: docker compose up --scale worker=3
    # Consume ONLY 'default'. The 'dead_letter' queue has no consumer on purpose:
    # failed jobs park there for human review instead of being auto-drained.
    command: ["celery", "-A", "sherpa.worker.celery_app", "worker",
              "--loglevel=info", "--queues=default"]

  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "sherpa.worker.celery_app", "beat", "--loglevel=info"]

volumes:
  pg-data:
  qdrant-data:
  minio-data:
  hf-cache:
